name: Check

on: [push]

jobs:
  check:
    strategy:
        fail-fast: false
        matrix:
          os:
            - { name: "Linux", label: "ubuntu-latest" }
            - { name: "Windows", label: "windows-latest" }
            - { name: "macOS", label: "macos-latest" }
    name: Build on ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.label }}
    
    steps:
      - name: Checkout code
      - uses: actions/checkout@v4

      - name: Setup Dependencies
        if: startsWith(matrix.os.label, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev

      - name: Cargo check
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-features

  clippy:
    name: Clippy
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-features
  
  msrv:
    name: MSRV
    steps:
    - uses: actions/checkout@v4
    - uses: taiki-e/install-action@cargo-hack
    - run: cargo hack check --rust-version --feature-powerset --all-targets