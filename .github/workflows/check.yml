name: Check

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all-features

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-features

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install libudev-dev libhidapi-dev

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --all-features

  verify-headers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Build Environment
        run: |
          sudo apt update
          sudo apt install libudev-dev libhidapi-dev

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cbindgen
        run: cargo binstall cbindgen --force --no-confirm
        
      - name: Verify generated headers
        run: |
          cbindgen \
            --crate wooting-analog-sdk \
            --output ./includes/wooting-analog-sdk.h \
            --verify
  
  msrv:
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libudev-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo hack
        run: cargo binstall cargo-hack --force --no-confirm

      - run: cargo hack check --rust-version --feature-powerset --all-targets